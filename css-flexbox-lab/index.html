<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox Lab - Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="status">ONLINE</div>
    <img class="photo" src="https://api.dicebear.com/7.x/avataaars/svg?seed=John" alt="profile">
    <h2 class="name">John Shoshone</h2>
    <div class="info">
      <img class="stars" src="https://i.imgur.com/iUpkmhs.png" alt="rating">
      <p class="title">Psychic Healer</p>
    </div>
    <div class="price">
      <p>5 mins free</p>
      <p>then $5.99/min</p>
    </div>
    <div class="actions">
      <div class="action phone">&#128222;</div>
      <div class="action chat">&#128172;</div>
    </div>
  </div>

</body>
</html>
